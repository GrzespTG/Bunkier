<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1f1c">
<title>Demon Biznesu Polska</title>
<style>
:root{
  --ink:#0c1a17;--ink2:#112420;--surf:#17302a;--surf2:#1d3b34;--line:#2b4d44;
  --txt:#eaf2ec;--mut:#8fa79e;--mint:#5be3a0;--gold:#f4c152;--red:#ff5468;--vio:#a78bfa;--sky:#6cc4ff;
  --r:18px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --f:"Avenir Next","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--f);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--ink)}
@media(min-width:800px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ===== MENU ===== */
.menu{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(24px + var(--safeT)) 22px calc(22px + var(--safeB))}
.menu .guil{position:absolute;left:50%;top:-4%;width:150%;max-width:1000px;transform:translateX(-50%);opacity:.9}
.menu .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,26,23,0) 0%,rgba(12,26,23,.0) 28%,var(--ink) 66%)}
.menu .in{position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo svg{width:68px;height:68px;flex:none;filter:drop-shadow(0 6px 18px rgba(167,139,250,.35))}
.title{font-weight:900;font-size:clamp(34px,10.5vw,60px);line-height:.92;letter-spacing:-.035em;margin:0}
.title span{display:block;font-size:.42em;letter-spacing:.02em;font-weight:700;color:var(--gold);margin-top:8px;font-style:italic}
.tag{color:var(--mut);margin:14px 0 20px;font-size:15px;line-height:1.45;max-width:34ch}
.mbtns{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;
  background:var(--surf);border:1px solid var(--line);padding:0 18px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#5be3a0,#2fb87a);color:#06251a;border:0;box-shadow:0 10px 28px rgba(91,227,160,.22)}
.btn.sec{background:rgba(255,255,255,.04)}
.btn.dng{background:linear-gradient(135deg,#ff5468,#d62f47);border:0}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 14px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--surf2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.lbl{color:var(--mut);font-size:13px;margin:12px 0 6px}

/* ===== PAGES ===== */
.page{flex:1;overflow:auto;padding:calc(18px + var(--safeT)) 18px calc(22px + var(--safeB));-webkit-overflow-scrolling:touch}
.page h2{margin:0 0 14px;font-size:26px;letter-spacing:-.02em}
.page p,.page li{color:#cfe0d8;line-height:1.55;font-size:15px}
.page ul{padding-left:20px;margin:6px 0 14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hs{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px}
.hs b{font-size:19px}.hs .n{flex:1;min-width:0}.hs .n div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs small{color:var(--mut)}.pos{width:28px;text-align:center;color:var(--gold);font-weight:900;font-size:18px}

/* ===== GAME HUD ===== */
.hud{padding:calc(10px + var(--safeT)) 14px 10px;background:linear-gradient(180deg,var(--ink2),var(--ink));border-bottom:1px solid var(--line);flex:none;position:relative;overflow:hidden}
.hud .gl{position:absolute;right:-70px;top:-80px;width:260px;opacity:.16;pointer-events:none}
.hrow{display:flex;align-items:center;gap:10px;position:relative}
.dayp{background:var(--gold);color:#2b2000;font-weight:900;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.loc{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:10px;position:relative}
.st{background:rgba(12,26,23,.55);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0}
.st small{color:var(--mut);font-size:11px;display:block}
.st b{font-size:16px;white-space:nowrap}
.st.cash b{color:var(--gold);font-size:19px}.st.debt b{color:var(--red)}.st.bank b{color:var(--sky)}
.cap{margin-top:8px;height:22px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);position:relative;overflow:hidden}
.cap i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2fb87a,#5be3a0);border-radius:999px;transition:width .3s}
.cap.full i{background:linear-gradient(90deg,#e0902e,#f4c152)}
.cap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.main{flex:1;overflow:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink2);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safeB))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;color:var(--mut);font-size:11.5px;font-weight:700;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--mint);background:var(--surf)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--red)}

/* ===== MARKET ===== */
.news{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(167,139,250,.14),rgba(167,139,250,.04));border:1px solid rgba(167,139,250,.3);
  border-radius:14px;padding:9px 12px;font-size:13.5px;margin-bottom:10px;color:#e4dcff;line-height:1.35}
.news svg{width:20px;height:20px;flex:none;color:var(--vio)}
.sect{margin:14px 2px 8px;font-weight:800;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.sect.cb{color:var(--vio)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.g{background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.g.sel{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.g.cbg{border-color:#46386f;background:linear-gradient(180deg,#1c2a3a 0%,var(--surf) 100%)}
.g.cbg.sel{border-color:var(--vio);box-shadow:0 0 0 1px var(--vio) inset}
.gh{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left}
.gi{width:46px;height:46px;border-radius:13px;background:var(--ink2);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.gi svg{width:34px;height:34px}
.gn{flex:1;min-width:0}
.gn b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn small{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{white-space:nowrap;display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
.pill.cheap{background:rgba(91,227,160,.18);color:var(--mint)}
.pill.dear{background:rgba(255,84,104,.18);color:#ff8d9b}
.pill.cbp{background:rgba(167,139,250,.2);color:var(--vio)}
.gp{text-align:right;flex:none}
.gp b{font-size:18px;display:block}
.gp small{font-size:12px;font-weight:700}
.tu{color:#f4c152}.td{color:#7cc4ff}.gp i{font-style:normal;opacity:.75}.legend{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mut);margin-bottom:8px;line-height:1.7}
.up{color:var(--mint)}.dn{color:#ff8d9b}.fl{color:var(--mut)}
.gp.na b{color:var(--mut);font-size:14px}
.trade{padding:2px 12px 14px;border-top:1px dashed var(--line);margin-top:2px}
.trade .tr{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.stp{display:flex;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:1}
.stp button{width:46px;height:46px;font-size:24px;font-weight:700;color:var(--mint)}
.stp input{flex:1;min-width:0;width:100%;height:46px;background:none;border:0;color:var(--txt);font:inherit;font-weight:900;font-size:19px;text-align:center}
.pre{display:flex;gap:6px;margin-top:8px}
.pre button{flex:1;height:36px;border-radius:10px;background:var(--ink2);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--mut)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tb .btn{min-height:52px;flex-direction:column;gap:0;font-size:15px;line-height:1.15}
.tb .btn small{font-weight:600;font-size:12px;opacity:.85}
.buy{background:linear-gradient(135deg,#5be3a0,#2fb87a);color:#06251a;border:0}
.sell{background:linear-gradient(135deg,#f4c152,#e0902e);color:#2b1a00;border:0}
.lnk{display:flex;justify-content:space-between;margin-top:8px}
.lnk button{color:var(--mut);font-weight:700;font-size:13px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* ===== MAP ===== */
.mapw{background:radial-gradient(120% 90% at 50% 20%,#1b3a33,#0f2420);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mapw svg{width:100%;height:auto;max-height:52vh}
.cname{font-size:11.5px;font-weight:800;fill:#dbe9e2;paint-order:stroke;stroke:#0c1a17;stroke-width:3px;stroke-linejoin:round}
.cdot{cursor:pointer}
.pulse{animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.cinfo{margin-top:10px}
.cinfo h3{margin:0 0 2px;font-size:20px}
.cinfo .sub{color:var(--mut);font-size:13px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;margin:10px 0}
.chip{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11.5px;min-width:0}
.chip small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-size:13.5px}
.chip.c{border-color:rgba(91,227,160,.5)}.chip.d{border-color:rgba(255,84,104,.45)}
.heat{display:inline-flex;align-items:center;gap:6px}
.heatb{width:56px;height:6px;border-radius:9px;background:var(--ink2);overflow:hidden;display:inline-block}
.heatb i{display:block;height:100%;background:linear-gradient(90deg,#f4c152,#ff5468)}

/* ===== VEHICLES / BANK / NEWS ===== */
.veh{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px}
.veh .vi{width:84px;flex:none}
.veh .vt{flex:1;min-width:0}
.veh .vt b{font-size:17px}.veh .vt small{display:block;color:var(--mut);margin:2px 0 6px;line-height:1.35}
.vs{display:flex;flex-wrap:wrap;gap:5px}
.vs span{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700}
.veh.cur{border-color:var(--mint)}
.bank .big{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line)}
.bank .big span{color:var(--mut)}.bank .big b{font-size:22px}
.logl{display:grid;gap:8px}
.logl div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.4}
.logl small{color:var(--mut);display:block;font-size:11.5px}
.logl .bad{border-color:rgba(255,84,104,.45)}.logl .good{border-color:rgba(91,227,160,.45)}.logl .info{border-color:rgba(167,139,250,.45)}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(5,12,10,.72);backdrop-filter:blur(4px)}
#modal.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--surf);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:0 18px calc(18px + var(--safeB));
  animation:up .22s ease-out;max-height:92vh;overflow:auto}
@media(min-width:800px){#modal{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.scene{margin:0 -18px 12px;height:150px;overflow:hidden;border-radius:26px 26px 0 0;position:relative}
.scene svg{width:100%;height:100%}
.sheet h3{margin:0 0 6px;font-size:23px;letter-spacing:-.02em}
.sheet p{margin:0 0 14px;color:#cfe0d8;line-height:1.5;font-size:15.5px}
.sheet .opts{display:grid;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:14px;background:var(--ink2);border:1px solid var(--line);min-height:54px;justify-content:center}
.opt b{font-size:16px}.opt small{color:var(--mut);font-size:12.5px;margin-top:1px}
.opt:active{background:var(--surf2)}
.opt.go{border-color:var(--mint);background:rgba(91,227,160,.1)}
.opt.risk{border-color:rgba(255,84,104,.55);background:rgba(255,84,104,.08)}
.flash{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{opacity:.35}}
.toast{position:fixed;left:50%;top:calc(70px + var(--safeT));transform:translateX(-50%);background:var(--surf2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tt 2.1s forwards;pointer-events:none;white-space:nowrap}
@keyframes tt{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.endn{font-size:44px;font-weight:900;letter-spacing:-.03em}
.rankt{font-size:24px;font-weight:900;color:var(--gold);margin:4px 0 10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:14px 0}.kv span{color:var(--mut)}.kv b{text-align:right}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';
/* ================= NARZĘDZIA ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RND=Math.random;
const rr=(a,b)=>a+RND()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(RND()*a.length)];
const nf=new Intl.NumberFormat('pl-PL');
const fmt=n=>nf.format(Math.round(n))+' zł';
const fnum=n=>nf.format(Math.round(n));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= DANE ================= */
const GOODS=[
 {id:'coal',depth:150,n:'Węgiel',base:55,vol:.10,u:'t'},
 {id:'sugar',depth:120,n:'Cukier',base:85,vol:.10},
 {id:'flour',depth:130,n:'Mąka',base:65,vol:.10},
 {id:'vodka',depth:90,n:'Wódka',base:150,vol:.12},
 {id:'clothes',depth:70,n:'Odzież',base:190,vol:.12},
 {id:'parts',depth:45,n:'Części samochodowe',base:330,vol:.13},
 {id:'elec',depth:30,n:'Elektronika',base:680,vol:.15},
 {id:'cigs',depth:40,n:'Papierosy bez akcyzy',base:270,vol:.20,c:1,risk:.15},
 {id:'fake',depth:25,n:'Podróbki znanych marek',base:440,vol:.22,c:1,risk:.25},
 {id:'money',depth:15,n:'Fałszywe banknoty',base:950,vol:.26,c:1,risk:.35},
 {id:'drugs',depth:10,n:'Narkotyki',base:1900,vol:.30,c:1,risk:.5}
];
const GI={};GOODS.forEach((g,i)=>GI[g.id]=i);
const CITIES=[
 {id:'war',n:'Warszawa',lon:21.01,lat:52.23,pol:1.0,prod:[],dem:['elec','clothes','vodka'],cb:{money:'d',drugs:'d',fake:'d'},a:'e'},
 {id:'kra',n:'Kraków',lon:19.94,lat:50.06,pol:.85,prod:['clothes'],dem:['vodka','parts'],cb:{drugs:'d',fake:'d',cigs:'d'},a:'e',dy:14},
 {id:'lod',n:'Łódź',lon:19.46,lat:51.76,pol:.7,prod:['clothes','flour'],dem:['elec'],cb:{fake:'c',cigs:'d'},a:'w'},
 {id:'wro',n:'Wrocław',lon:17.04,lat:51.11,pol:.8,prod:['parts'],dem:['coal','sugar'],cb:{drugs:'c',money:'d'},a:'w'},
 {id:'poz',n:'Poznań',lon:16.93,lat:52.41,pol:.75,prod:['sugar','flour'],dem:['parts','elec'],cb:{money:'c',cigs:'d'},a:'w'},
 {id:'gda',n:'Gdańsk',lon:18.65,lat:54.35,pol:.8,prod:['elec'],dem:['coal','flour'],cb:{drugs:'c',fake:'c'},a:'w'},
 {id:'szc',n:'Szczecin',lon:14.55,lat:53.43,pol:.65,prod:['parts'],dem:['sugar','vodka'],cb:{cigs:'c',drugs:'c',money:'d'},a:'e'},
 {id:'kat',n:'Katowice',lon:19.02,lat:50.26,pol:.9,prod:['coal'],dem:['clothes','sugar','flour'],cb:{money:'c',cigs:'d',drugs:'d'},a:'w',dy:-6},
 {id:'lub',n:'Lublin',lon:22.57,lat:51.25,pol:.6,prod:['flour','sugar'],dem:['parts','elec'],cb:{cigs:'c',fake:'d'},a:'w'},
 {id:'bia',n:'Białystok',lon:23.16,lat:53.13,pol:.55,prod:['flour','vodka'],dem:['elec','parts'],cb:{cigs:'c',fake:'c',money:'d'},a:'w'},
 {id:'rze',n:'Rzeszów',lon:22.0,lat:50.04,pol:.55,prod:['parts'],dem:['coal','clothes'],cb:{cigs:'c',drugs:'d'},a:'w'},
 {id:'byd',n:'Bydgoszcz',lon:18.0,lat:53.12,pol:.6,prod:['sugar'],dem:['vodka','elec'],cb:{fake:'d',money:'d'},a:'e'},
 {id:'ols',n:'Olsztyn',lon:20.48,lat:53.78,pol:.5,prod:['flour'],dem:['clothes','parts'],cb:{cigs:'d',drugs:'d'},a:'e'},
 {id:'kie',n:'Kielce',lon:20.63,lat:50.87,pol:.6,prod:['vodka'],dem:['flour','coal'],cb:{fake:'c',drugs:'d'},a:'e'},
 {id:'opo',n:'Opole',lon:17.92,lat:50.67,pol:.6,prod:['sugar','vodka'],dem:['elec','clothes'],cb:{cigs:'c',money:'d'},a:'w',dy:6},
 {id:'zie',n:'Zielona Góra',lon:15.51,lat:51.94,pol:.5,prod:['vodka'],dem:['parts','sugar'],cb:{drugs:'c',money:'c'},a:'w'}
];
const VEH=[
 {id:'bus',n:'Plecak i autobus',cap:25,fuel:.18,speed:260,price:0,esc:.15,d:'Tanio w podróży, ale zabierzesz niewiele.'},
 {id:'opel',n:'Używany Opel',cap:70,fuel:.5,speed:380,price:14000,esc:.4,d:'Pierwszy prawdziwy transport. Zawsze coś w nim stuka.'},
 {id:'van',n:'Dostawczak',cap:160,fuel:.85,speed:380,price:48000,esc:.3,d:'Duża ładownia i spokojny wygląd firmowego auta.'},
 {id:'sport',n:'Sportowe coupé',cap:55,fuel:1.1,speed:520,price:90000,esc:.8,d:'Mało miejsca, ale ucieczka przed policją bywa skuteczna.'},

];
const COP=1.0; // mnożnik globalny ryzyka
const RANKS=[[-1e12,'Bankrut'],[1,'Handlarz z bazaru'],[25000,'Obwoźny kupiec'],[100000,'Hurtownik'],[200000,'Przedsiębiorca'],[500000,'Biznesmen'],[1000000,'Magnat'],[2000000,'Demon Biznesu']];
const rankOf=s=>{let r=RANKS[0][1];for(const[t,n]of RANKS)if(s>=t)r=n;return r;};

/* ================= STAN GRY ================= */
let S=null;
let OPT=LS.get('db_opt',{sound:true,days:100,name:'Gracz'});
const km=(a,b)=>{const A=CITIES[a],B=CITIES[b];return Math.hypot((A.lon-B.lon)*68.4,(A.lat-B.lat)*111.2);};
const DIST=CITIES.map((_,i)=>CITIES.map((_,j)=>km(i,j)));
const tripDays=(a,b,v)=>Math.max(1,Math.ceil(DIST[a][b]/VEH[v??S.veh].speed));
const tripCost=(a,b,v)=>Math.round(DIST[a][b]*VEH[v??S.veh].fuel);
const used=()=>GOODS.reduce((s,g)=>s+(S.inv[g.id]?S.inv[g.id].q:0),0);
const cap=()=>VEH[S.veh].cap;
const score=()=>S.cash+S.bank-S.debt;

function newGame(days,seed){
  if(seed!=null)RND=mulberry(seed);else RND=Math.random;
  const nC=CITIES.length,nG=GOODS.length;
  S={day:1,maxDays:days||100,name:OPT.name||'Gracz',cash:5000,bank:0,debt:4000,city:ri(0,nC-1),veh:0,inv:{},
    m:CITIES.map(()=>GOODS.map(g=>1+rr(-.25,.25))),prev:null,mods:[],heat:CITIES.map(()=>ri(5,35)),
    visited:{},seen:CITIES.map(()=>GOODS.map(()=>null)),log:[],news:null,
    stats:{trades:0,profit:0,raids:0,bribes:0,busts:0,maxScore:0,kmDone:0,best:0},ended:false,debtLimit:40000};
  S.prev=CITIES.map((_,c)=>GOODS.map((_,g)=>mid(c,g)));
  S.visited[S.city]=1;recordSeen(S.city);
  addLog('Zaczynasz w mieście '+CITIES[S.city].n+'. Masz '+fmt(S.cash)+' i dług '+fmt(S.debt)+' u lichwiarza.','info');
  return S;
}
function cmod(c,g){const C=CITIES[c],G=GOODS[g];
  if(G.c){const t=C.cb[G.id];if(!t)return null;return t==='c'?.57:1.62;}
  if(C.prod.includes(G.id))return .72;if(C.dem.includes(G.id))return 1.32;return 1;}
function mid(c,g){const cm=cmod(c,g);if(cm==null)return null;let p=GOODS[g].base*cm*S.m[c][g];
  for(const x of S.mods)if(x.c===c&&x.g===g&&x.until>=S.day)p*=x.mult;return Math.max(5,p);}
const impact=(g,q)=>q/GOODS[g].depth*.10;
/** cena pierwszej sztuki (bez wpływu partii) */
const buyP=(c,g)=>{const m=mid(c,g);return m==null?null:Math.ceil(m*1.05);};
const sellP=(c,g)=>{const m=mid(c,g);return m==null?null:Math.floor(m*.95);};
/** łączny koszt kupna q sztuk i wpływ zakupu na cenę */
const buyTotal=(c,g,q)=>{const m=mid(c,g);return m==null?null:Math.ceil(m*1.05*(1+impact(g,q)/2))*q;};
const sellTotal=(c,g,q)=>{const m=mid(c,g);return m==null?null:Math.floor(m*.95*Math.max(.35,1-impact(g,q)/2))*q;};
const maxBuy=(c,g)=>{const m=mid(c,g);if(m==null)return 0;let lo=0,hi=Math.max(0,cap()-used());while(lo<hi){const x=Math.ceil((lo+hi)/2);if(buyTotal(c,g,x)<=S.cash)lo=x;else hi=x-1;}return lo;};
function recordSeen(c){S.seen[c]=GOODS.map((_,g)=>{const m=mid(c,g);return m==null?null:Math.ceil(m*1.05);});(S.seenDay||(S.seenDay={}))[c]=S.day;}
function addLog(t,k){S.log.unshift({d:S.day,t,k:k||''});if(S.log.length>60)S.log.pop();}
function dayTick(){
  S.prev=CITIES.map((_,c)=>GOODS.map((_,g)=>mid(c,g)));
  for(let c=0;c<CITIES.length;c++)for(let g=0;g<GOODS.length;g++){
    const v=GOODS[g].vol;let m=S.m[c][g];m+=(1-m)*.17+(RND()-.5)*v*2;S.m[c][g]=clamp(m,.55,1.9);}
  S.day++;
  S.debt=Math.ceil(S.debt*1.02);S.bank=Math.floor(S.bank*1.0015);
  for(let c=0;c<S.heat.length;c++)S.heat[c]=Math.max(0,S.heat[c]-1.6);
  S.mods=S.mods.filter(x=>x.until>=S.day);
}
function totalCbCost(){let s=0;for(const g of GOODS)if(g.c&&S.inv[g.id])s+=S.inv[g.id].q*S.inv[g.id].avg;return s;}
function cbLoad(){let l=0;for(const g of GOODS)if(g.c&&S.inv[g.id])l+=S.inv[g.id].q*g.risk;return l;}
function raidChance(c){const l=cbLoad();if(!l)return 0;
  return clamp((.02+CITIES[c].pol*.06+S.heat[c]/100*.10+l*.0035)*COP,0,.5);}

/* ---------- handel ---------- */
function buy(g,q){
  const p=buyP(S.city,g);if(p==null)return 'Tu nikt tego nie sprzedaje.';
  q=Math.floor(q);if(q<1)return 'Podaj ilość.';
  if(used()+q>cap())return 'Brak miejsca w ładowni (wolne: '+(cap()-used())+').';
  const tot=buyTotal(S.city,g,q);if(tot>S.cash)return 'Za mało gotówki.';
  const id=GOODS[g].id,it=S.inv[id]||(S.inv[id]={q:0,avg:0});
  it.avg=(it.avg*it.q+tot)/(it.q+q);it.q+=q;S.cash-=tot;S.stats.trades++;
  S.m[S.city][g]=Math.min(2.4,S.m[S.city][g]*(1+impact(g,q)));
  return null;
}
function sell(g,q){
  const p=sellP(S.city,g);if(p==null)return 'Tu nikt tego nie kupuje.';
  const id=GOODS[g].id,it=S.inv[id];if(!it||!it.q)return 'Nie masz tego towaru.';
  q=Math.min(Math.floor(q),it.q);if(q<1)return 'Podaj ilość.';
  const gain=sellTotal(S.city,g,q);S.cash+=gain;const prof=gain-it.avg*q;S.stats.profit+=prof;S.stats.best=Math.max(S.stats.best,prof);S.stats.trades++;
  it.q-=q;if(it.q<=0)delete S.inv[id];
  S.m[S.city][g]=Math.max(.4,S.m[S.city][g]*Math.max(.35,1-impact(g,q)));
  if(GOODS[g].c)S.heat[S.city]=Math.min(100,S.heat[S.city]+q*GOODS[g].risk*.8);
  return null;
}
/* ---------- bank ---------- */
function bankDo(act,n){
  n=Math.floor(n);if(!(n>0))return 'Podaj kwotę.';
  if(act==='dep'){if(n>S.cash)return 'Masz za mało gotówki.';S.cash-=n;S.bank+=n;}
  else if(act==='wd'){if(n>S.bank)return 'Na koncie jest mniej.';S.bank-=n;S.cash+=n;}
  else if(act==='loan'){if(S.debt+n>S.debtLimit)return 'Lichwiarz da Ci najwyżej '+fmt(Math.max(0,S.debtLimit-S.debt))+' więcej.';S.debt+=n;S.cash+=n;}
  else if(act==='pay'){n=Math.min(n,S.debt);if(n>S.cash)return 'Masz za mało gotówki.';S.cash-=n;S.debt-=n;}
  return null;
}
function buyVeh(i){
  const v=VEH[i],cur=VEH[S.veh];if(i===S.veh)return 'Już nim jeździsz.';
  const net=v.price-Math.floor(cur.price*.5);
  if(used()>v.cap)return 'Ładunek nie zmieści się w tym pojeździe. Sprzedaj część towaru.';
  if(net>S.cash)return 'Brakuje '+fmt(net-S.cash)+'.';
  S.cash-=net;S.veh=i;addLog('Nowy pojazd: '+v.n+'.','good');return null;
}

let PQ=[];            // kolejka okien
function modal(o){PQ.push(o);}
function travelPlan(to){
  if(to===S.city)return {err:'Jesteś już w tym mieście.'};
  const d=tripDays(S.city,to),c=tripCost(S.city,to);
  if(c>S.cash)return {err:'Brakuje Ci '+fmt(c-S.cash)+' na paliwo albo bilet.'};
  return {days:d,cost:c};
}
function travelNow(to){          // logika podróży bez animacji
  const pl=travelPlan(to);if(pl.err)return pl.err;
  recordSeen(S.city);
  S.cash-=pl.cost;S.stats.kmDone+=Math.round(DIST[S.city][to]);
  for(let i=0;i<pl.days;i++)dayTick();
  S.city=to;S.visited[to]=1;
  if(S.day>S.maxDays){endGame('time');return null;}
  recordSeen(to);
  addLog('Dotarłeś do miasta '+CITIES[to].n+' (dzień '+S.day+').');
  policeCheck(to);
  randomEvent(to);
  return null;
}
function policeCheck(c){
  const p=raidChance(c);if(!(RND()<p))return;
  S.stats.raids++;S.heat[c]=Math.min(100,S.heat[c]+15);
  const cost=totalCbCost(),bribe=Math.round(cost*.22+300),v=VEH[S.veh];
  const pEsc=clamp(v.esc*(1-CITIES[c].pol*.25),.05,.9),pBr=.75;
  const fine=Math.max(200,Math.round(S.cash*.08));
  modal({scene:'police',title:'Kontrola policji!',
    text:'Funkcjonariusze zatrzymali Twój pojazd na wjeździe do miasta '+CITIES[c].n+' i przeszukują ładunek. Masz przy sobie kontrabandę o wartości zakupu '+fmt(cost)+'.',
    opts:[
     {t:'Daj łapówkę — '+fmt(bribe),s:'Szansa powodzenia '+Math.round(pBr*100)+'%. Jeśli odmówią, trafiasz do aresztu.',cls:'go',
      fn:()=>{if(bribe>S.cash)return '__nomoney';S.cash-=bribe;S.stats.bribes++;
        if(RND()<pBr){addLog('Łapówka przyjęta. Jedziesz dalej, kontrabanda bezpieczna.','good');return 'Policjant „nic nie widział”. Zapłacono '+fmt(bribe)+'.';}
        return bust(c,true);}},
     {t:'Uciekaj',s:'Szansa ucieczki '+Math.round(pEsc*100)+'% ('+v.n+'). Pościg kończy się aresztem.',cls:'risk',
      fn:()=>{if(RND()<pEsc){S.heat[c]=Math.min(100,S.heat[c]+20);addLog('Ucieczka przed policją udana.','good');return 'Zgubiłeś radiowóz na bocznych drogach. Ładunek jest cały, ale policja w mieście jest teraz czujniejsza.';}
        return bust(c,true);}},
     {t:'Poddaj się',s:'Tracisz całą kontrabandę i płacisz mandat '+fmt(fine)+'.',
      fn:()=>{const lost=cbLoss();S.cash=Math.max(0,S.cash-fine);S.stats.busts++;addLog('Konfiskata kontrabandy. Mandat '+fmt(fine)+'.','bad');return 'Skonfiskowano towar o wartości zakupu '+fmt(lost)+'. Mandat: '+fmt(fine)+'.';}}
    ]});
}
function cbLoss(){let l=0;for(const g of GOODS)if(g.c&&S.inv[g.id]){l+=S.inv[g.id].q*S.inv[g.id].avg;delete S.inv[g.id];}return l;}
function bust(c,hard){
  const lost=cbLoss(),cashLost=Math.round(S.cash*.6);S.cash-=cashLost;S.stats.busts++;
  addLog('Areszt! Tracisz kontrabandę i '+fmt(cashLost)+' gotówki.','bad');
  for(let i=0;i<3&&S.day<=S.maxDays;i++)dayTick();
  if(S.day>S.maxDays){endGame('time');}
  return 'Areszt. Policja zabrała towar (wartość zakupu '+fmt(lost)+') oraz '+fmt(cashLost)+' gotówki, którą miałeś przy sobie. Trzy dni w areszcie. Pieniądze w banku są bezpieczne.';
}

function randomEvent(c){
  if(RND()>.42)return;
  const tot=EV.reduce((x,e)=>x+e.w,0);
  for(let k=0;k<5;k++){let r=RND()*tot,ev=EV[0];for(const e of EV){r-=e.w;if(r<=0){ev=e;break;}}
    if(ev.f(c))return;}
}
function endGame(why){
  S.ended=why||'quit';const sc=score();
  const list=LS.get('db_scores',[]);list.push({name:S.name,score:sc,days:Math.min(S.day,S.maxDays),rank:rankOf(sc),date:new Date().toISOString().slice(0,10)});
  list.sort((a,b)=>b.score-a.score);LS.set('db_scores',list.slice(0,10));LS.set('db_save',null);
}

function snd(k){if(!OPT.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime;const tone=(f,d,type,v,w)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t0+(w||0));g.gain.exponentialRampToValueAtTime(.0001,t0+(w||0)+d);o.connect(g);g.connect(AC.destination);o.start(t0+(w||0));o.stop(t0+(w||0)+d+.02);};
  if(k==='buy'){tone(420,.09,'triangle');tone(560,.1,'triangle',.05,.07);}
  else if(k==='sell'){tone(740,.08,'sine',.06);tone(1100,.16,'sine',.06,.07);}
  else if(k==='bad'){tone(160,.3,'sawtooth',.05);tone(110,.35,'sawtooth',.05,.15);}
  else if(k==='siren'){for(let i=0;i<4;i++)tone(i%2?640:880,.18,'square',.03,i*.2);}
  else if(k==='go'){tone(220,.2,'triangle',.05);tone(330,.25,'triangle',.05,.15);}
  else if(k==='tap')tone(600,.04,'sine',.03);
}catch(e){}}

let _scrollKey='',_scrollTop=0;
function render(){
  const a=app();
  const m0=$('#main'),key=UI.screen+'|'+UI.tab+'|'+(UI.city||'')+'|'+(UI.travel?1:0);
  const keep=m0&&key===_scrollKey?m0.scrollTop:0;
  if(UI.screen==='menu')a.innerHTML=menuHTML();
  else if(UI.screen==='how')a.innerHTML=howHTML();
  else if(UI.screen==='scores')a.innerHTML=scoresHTML();
  else if(UI.screen==='end')a.innerHTML=endHTML();
  else a.innerHTML=gameHTML();
  _scrollKey=key;
  const m1=$('#main');
  if(m1&&keep){m1.scrollTop=keep;}
  if(UI.screen==='game'&&UI.sel&&m1){const s=m1.querySelector('.g.sel');if(s){const mr=m1.getBoundingClientRect(),sr=s.getBoundingClientRect();
    if(sr.bottom>mr.bottom)m1.scrollTop+=Math.min(sr.bottom-mr.bottom+8,sr.top-mr.top-4);}}
  if(UI.screen==='game'&&UI.travel)startAnim();
}

  if(it){const diff=sp==null?null:sp-it.avg;owned=`<span>Masz ${it.q} szt. · śr. ${fnum(it.avg)} zł</span>${diff==null?'':`<span class="${diff>=0?'up':'dn'}">${diff>=0?'+':''}${fnum(diff)} zł/szt.</span>`}`;}
  else owned=`<span>${bp==null?'Brak popytu i podaży w tym mieście':'Brak w ładowni'}</span>`;
  let h=`<div class="g ${G.c?'cbg':''} ${sel?'sel':''}"><button class="gh" data-act="sel" data-v="${id}" ${bp==null?'disabled style="opacity:.55"':''}>
   <div class="gi">${icon(id)}</div><div class="gn"><b>${esc(G.n)}</b><small>${tag}${owned}</small></div>
   <div class="gp ${bp==null?'na':''}">${bp==null?'<b>brak</b>':`<b class="num">${fnum(bp)} zł</b>${trendHTML(S.city,g)}`}</div></button>`;
  if(sel&&bp!=null){
    const q=UI.qty,maxB=maxBuy(S.city,g),sq=Math.min(q,it?it.q:q);
    h+=`<div class="trade"><div class="tr"><div class="stp"><button data-act="qd" data-v="-1" aria-label="Mniej">−</button><input id="qty" type="number" inputmode="numeric" min="1" value="${q}"><button data-act="qd" data-v="1" aria-label="Więcej">+</button></div></div>
    <div class="pre">${[1,5,10,25,100].map(n=>`<button data-act="qs" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="tb"><button class="btn buy" data-act="buy"><span>Kup ${q} szt.</span><small class="num">${fmt(buyTotal(S.city,g,q))}</small></button>
     <button class="btn sell ${it?'':'dis'}" data-act="sell"><span>Sprzedaj ${sq} szt.</span><small class="num">${sp==null?'—':fmt(sellTotal(S.city,g,sq))}</small></button></div>
    <div class="lnk"><button data-act="buymax">Kup maksymalnie (${maxB})</button>${it?`<button data-act="sellall">Sprzedaj wszystko (${it.q})</button>`:''}</div></div>`;
  }
  return h+'</div>';
}
function marketHTML(){
  let h='';
  if(S.news)h+=`<div class="news"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9h8M8 12h8M8 15h5" fill="none" stroke="currentColor" stroke-width="2"/></svg><div>${esc(S.news)}</div></div>`;
  h+='<div class="legend"><b>Jak czytać ceny:</b> <span class="pill cheap">Tanio</span>/<span class="pill dear">Drogo</span> = cena względem średniej krajowej (np. „Tanio −22%” to 22% poniżej średniej) (kupuj tanio, sprzedawaj drogo). <span class="tu">▲</span>/<span class="td">▼</span> = zmiana ceny od wczoraj. Towar może być tani, a mimo to drożeć.</div><div class="sect">Towary legalne</div>';
  GOODS.forEach((G,g)=>{if(!G.c)h+=goodRow(g);});
  h+=`<div class="sect cb">Kontrabanda · alarm policji w mieście ${Math.round(S.heat[S.city])}%</div>`;
  GOODS.forEach((G,g)=>{if(G.c)h+=goodRow(g);});
  return h;
}
function mapHTML(){
  const cur=S.city,sc=UI.city;
  let svg=`<svg viewBox="0 0 515 480" id="mapsvg"><defs><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2b4d44" stroke-width=".5" opacity=".6"/></pattern>
   <linearGradient id="pf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a5a4c"/><stop offset="1" stop-color="#1c4137"/></linearGradient></defs>
   <rect width="515" height="480" fill="url(#gr)"/><path d="${POLPATH}" fill="url(#pf)" stroke="#5be3a0" stroke-opacity=".6" stroke-width="2" stroke-linejoin="round"/>`;
  if(sc!=null&&sc!==cur){const a=cpos(cur),b=cpos(sc);svg+=`<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="#f4c152" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity=".9"/>`;}
  CITIES.forEach((C,i)=>{const[x,y]=cpos(i),vis=S.visited[i],isC=i===cur,isS=i===sc;
    const lx=C.a==='w'?x-11:x+11,anc=C.a==='w'?'end':'start';
    svg+=`<g class="cdot" data-act="city" data-v="${i}">${isC?`<circle class="pulse" cx="${x}" cy="${y}" r="9" fill="#5be3a0"/>`:''}<circle cx="${x}" cy="${y}" r="18" fill="transparent"/>
    <circle cx="${x}" cy="${y}" r="${isC||isS?7.5:5.5}" fill="${isC?'#5be3a0':isS?'#f4c152':vis?'#eaf2ec':'#6b857b'}" stroke="#0c1a17" stroke-width="2"/>
    <text class="cname" x="${lx}" y="${y+4+(C.dy||0)}" text-anchor="${anc}">${esc(C.n)}</text></g>`;});
  svg+='<g id="vehg" style="display:none"><circle r="11" fill="#f4c152" stroke="#0c1a17" stroke-width="3"/><circle r="4" fill="#0c1a17"/></g></svg>';
  let info='';
  if(UI.travel)info=`<div class="card cinfo"><h3>W drodze do miasta ${esc(CITIES[UI.travel.to].n)}</h3><div class="sub">Podróż trwa ${UI.travel.days} ${UI.travel.days===1?'dzień':'dni'}…</div></div>`;
  else if(sc==null)info='<div class="card cinfo"><h3>Dokąd jedziesz?</h3><div class="sub">Stuknij miasto na mapie, żeby zobaczyć koszt podróży i ostatnie znane ceny.</div></div>';
  else {const C=CITIES[sc];const same=sc===cur;
    let chips='';
    if(S.visited[sc]){const ago=S.day-(S.seenDay&&S.seenDay[sc]||S.day);chips=`<div class="chips">${GOODS.map((G,g)=>{const p=S.seen[sc][g];if(p==null)return '';const r=p/(G.base*1.05);return `<div class="chip ${r<=.8?'c':r>=1.3?'d':''}"><small>${SHORT[G.id]}</small><b class="num">~${fnum(p)} zł</b></div>`;}).join('')}</div><div class="sub">Ostatnie znane ceny kupna z dnia ${S.seenDay&&S.seenDay[sc]||'?'} (${ago?ago+' dni temu':'dziś'}). Po podróży ceny zwykle się zmieniają, przeciętnie o kilka–kilkanaście procent, więc traktuj je jako orientacyjne.</div>`;}
    else chips='<div class="sub" style="margin:8px 0">Nie byłeś tu jeszcze. Ceny poznasz na miejscu.</div>';
    let go='';
    if(!same){const p=travelPlan(sc);const late=!p.err&&S.day+p.days>S.maxDays;
      go=p.err?`<div style="color:var(--red);font-weight:700;margin:6px 0">${p.err}</div>`:`<div class="sub" style="margin:8px 0">Dystans ${fnum(DIST[cur][sc])} km · ${p.days} ${p.days===1?'dzień':'dni'} · koszt ${fmt(p.cost)}${late?'<br><span style="color:var(--red)">Ta podróż przekroczy limit dni i zakończy grę.</span>':''}</div>
      <button class="btn pri" data-act="go" style="width:100%">Jedź do miasta ${esc(C.n)}</button>`;}
    info=`<div class="card cinfo"><h3>${esc(C.n)}${same?' (jesteś tu)':''}</h3>
     <div class="sub heat">Czujność policji: <span class="heatb"><i style="width:${clamp(C.pol*60+S.heat[sc]*.5,5,100)}%"></i></span> ${S.heat[sc]>=50?'wysoka':S.heat[sc]>=25?'podwyższona':'normalna'}</div>${chips}${go}</div>`;}
  return `<div class="mapw">${svg}</div>${info}`;
}
function vehHTML(){
  return VEH.map((v,i)=>{const cur=i===S.veh,net=v.price-Math.floor(VEH[S.veh].price*.5);
    return `<div class="card veh ${cur?'cur':''}"><div class="vi">${vehSVG(v.id)}</div><div class="vt"><b>${esc(v.n)}</b><small>${esc(v.d)}</small>
    <div class="vs"><span>${v.cap} miejsc</span><span>${v.fuel.toFixed(2).replace('.',',')} zł/km</span><span>${v.speed} km/dzień</span><span>ucieczka ${Math.round(v.esc*100)}%</span></div>
    ${cur?'<div style="color:var(--mint);font-weight:800;margin-top:8px">Twój pojazd</div>':`<button class="btn sm ${net<=S.cash?'pri':''}" data-act="bveh" data-v="${i}" style="margin-top:8px">${net<=0?'Zmień pojazd (dostajesz '+fmt(-net)+')':'Kup za '+fmt(net)}</button>`}</div></div>`;}).join('')+'<p style="color:var(--mut);font-size:13px;margin:4px 4px 0">Przy zakupie oddajesz obecny pojazd za połowę jego ceny.</p>';
}
function bankHTML(){
  return `<div class="card bank"><div class="big"><span>Gotówka w kieszeni</span><b class="num" style="color:var(--gold)">${fmt(S.cash)}</b></div>
   <div class="big"><span>Konto w banku (+0,15% dziennie)</span><b class="num" style="color:var(--sky)">${fmt(S.bank)}</b></div>
   <div class="big"><span>Dług u lichwiarza (+2% dziennie)</span><b class="num" style="color:var(--red)">${fmt(S.debt)}</b></div>
   <p style="color:var(--mut);font-size:13.5px;margin:10px 2px">Pieniądze z konta są bezpieczne przed napadem i aresztem. Gotówka nie.</p>
   <div class="stp" style="margin:6px 0"><button data-act="ad" data-v="-1000">−</button><input id="amt" type="number" inputmode="numeric" min="0" value="${UI.amt||1000}"><button data-act="ad" data-v="1000">+</button></div>
   <div class="pre"><button data-act="as" data-v="1000">1 tys.</button><button data-act="as" data-v="5000">5 tys.</button><button data-act="as" data-v="20000">20 tys.</button><button data-act="as" data-v="100000">100 tys.</button></div>
   <div class="row2" style="margin-top:12px"><button class="btn sm" data-act="bk" data-v="dep">Wpłać na konto</button><button class="btn sm" data-act="bk" data-v="wd">Wypłać z konta</button>
   <button class="btn sm" data-act="bk" data-v="loan">Pożycz od lichwiarza</button><button class="btn sm pri" data-act="bk" data-v="pay">Spłać dług</button></div>
   <div class="row2" style="margin-top:8px"><button class="btn sm sec" data-act="amax" data-v="cash">Cała gotówka</button><button class="btn sm sec" data-act="amax" data-v="bank">Całe konto</button></div></div>`;
}
function logHTML(){return `<div class="logl">${S.log.map(l=>`<div class="${l.k}"><small>Dzień ${l.d}</small>${esc(l.t)}</div>`).join('')}</div>`;}

/* --- okna --- */
function showModal(o){
  const m=$('#modal');
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="scene">${scene(o.scene)}</div><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p><div class="opts">${o.opts.map((x,i)=>`<button class="opt ${x.cls||''}" data-act="opt" data-v="${i}"><b>${esc(x.t)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</button>`).join('')}</div></div>`;
  m.classList.add('on');m._o=o;
  if(o.scene==='police')snd('siren');else if(o.scene==='rob'||o.scene==='broken')snd('bad');
}
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';m._o=null;}
function nextModal(){
  if(PQ.length){showModal(PQ.shift());return;}
  closeModal();save();
  if(S.ended){UI.screen='end';}
  render();
}
function pickOpt(i){
  const m=$('#modal'),o=m._o;if(!o)return;
  const r=o.opts[i].fn();
  if(r==='__nomoney'){toast('Nie stać Cię na to.');return;}
  if(r){showModal({scene:o.scene,title:'Co się stało',text:r,opts:[{t:'Dalej',cls:'go',fn:()=>null}]});return;}
  nextModal();
}

/* --- podróż z animacją --- */
function startAnim(){
  const g=$('#vehg'),T=UI.travel;if(!g||!T)return;
  const a=cpos(T.from),b=cpos(T.to);g.style.display='';
  const dur=700+T.days*600,t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const gg=$('#vehg');if(!gg||!UI.travel)return;gg.setAttribute('transform',`translate(${a[0]+(b[0]-a[0])*e} ${a[1]+(b[1]-a[1])*e})`);
    if(k<1)requestAnimationFrame(step);else finishTravel();};
  requestAnimationFrame(step);
}
function finishTravel(){
  const to=UI.travel.to;UI.travel=null;
  const err=travelNow(to);if(err)toast(err);
  UI.tab='market';UI.sel=null;UI.city=null;S.news=S.news&&PQ.length?S.news:S.news;
  if(S.ended&&!PQ.length){UI.screen='end';render();return;}
  snd('go');save();render();if(PQ.length)nextModal();
}
function doTravel(to){
  const p=travelPlan(to);if(p.err){toast(p.err);return;}
  S.news=null;UI.travel={from:S.city,to,days:p.days};UI.tab='map';snd('go');render();
}

/* --- obsługa kliknięć --- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(UI.travel&&a!=='opt')return;
  switch(a){
   case 'new':{UI.screen='game';newGame(OPT.days);UI.tab='market';UI.sel=null;UI.qty=1;UI.city=null;snd('go');save();render();break;}
   case 'cont':{const sv=LS.get('db_save',null);if(sv){S=sv;RND=Math.random;UI.screen='game';UI.tab='market';UI.sel=null;render();}break;}
   case 'how':UI.screen='how';render();break;
   case 'scores':UI.screen='scores';render();break;
   case 'menu':UI.screen='menu';render();break;
   case 'days':OPT.days=+v;LS.set('db_opt',OPT);render();break;
   case 'sound':OPT.sound=!OPT.sound;LS.set('db_opt',OPT);render();snd('tap');break;
   case 'gmenu':showModal({scene:'cash',title:'Menu gry',text:'Dzień '+S.day+' z '+S.maxDays+'. Wynik teraz: '+fmt(score())+'.',opts:[
      {t:'Wróć do gry',cls:'go',fn:()=>null},
      {t:'Zakończ grę i zapisz wynik',s:'Liczy się gotówka plus bank minus dług.',cls:'risk',fn:()=>{endGame('quit');return null;}},
      {t:'Wyjdź do menu',s:'Gra zostanie zapisana, możesz ją kontynuować.',fn:()=>{save();UI.screen='menu';return null;}}]});break;
   case 'opt':pickOpt(+v);break;
   case 'tab':UI.tab=v;render();break;
   case 'sel':UI.sel=UI.sel===v?null:v;UI.qty=1;snd('tap');render();break;
   case 'qd':UI.qty=clamp((+($('#qty')?.value)||UI.qty)+(+v),1,9999);render();break;
   case 'qs':UI.qty=+v;render();break;
   case 'buy':case 'sell':case 'buymax':case 'sellall':{
     const g=GI[UI.sel];if(g==null)break;let q=+($('#qty')?.value)||UI.qty;
     if(a==='buymax'){q=maxBuy(S.city,g);if(!q){toast(used()>=cap()?'Ładownia jest pełna.':'Za mało gotówki.');break;}}
     if(a==='sellall'){q=S.inv[UI.sel]?S.inv[UI.sel].q:0;}
     const err=(a==='buy'||a==='buymax')?buy(g,q):sell(g,q);
     if(err){toast(err);snd('bad');}else{snd(a==='buy'||a==='buymax'?'buy':'sell');UI.qty=Math.max(1,Math.min(UI.qty,9999));}
     save();render();break;}
   case 'city':UI.city=+v;render();snd('tap');break;
   case 'go':if(UI.city!=null)doTravel(UI.city);break;
   case 'bveh':{const err=buyVeh(+v);if(err)toast(err);else{snd('sell');save();}render();break;}
   case 'ad':UI.amt=Math.max(0,(+($('#amt')?.value)||UI.amt||0)+(+v));render();break;
   case 'as':UI.amt=+v;render();break;
   case 'amax':UI.amt=v==='cash'?S.cash:S.bank;render();break;
   case 'bk':{const err=bankDo(v,+($('#amt')?.value)||UI.amt||0);if(err){toast(err);snd('bad');}else{snd('sell');save();}render();break;}
  }
  if(a==='opt'&&UI.screen==='menu')render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='qty'){UI.qty=clamp(+e.target.value||1,1,9999);const r=$('#main');const s=r?r.scrollTop:0;render();const m=$('#main');if(m)m.scrollTop=s;const q=$('#qty');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
  if(e.target.id==='amt')UI.amt=Math.max(0,+e.target.value||0);
  if(e.target.id==='pname'){OPT.name=e.target.value.slice(0,14)||'Gracz';LS.set('db_opt',OPT);}
});
window.addEventListener('DOMContentLoaded',render);
window.DBG={get S(){return S},UI,newGame,buy,sell,bankDo,buyVeh,travelNow,travelPlan,policeCheck,PQ,GOODS,CITIES,VEH,mid,buyP,sellP,buyTotal,sellTotal,maxBuy,impact,used,cap,score,raidChance,tripDays,tripCost,DIST,endGame,render,showModal,nextModal,pickOpt,rankOf,fmt,dayTick,addLog};
</script></body></html>
